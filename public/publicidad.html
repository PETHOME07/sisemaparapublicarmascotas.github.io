
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportar Mascota Perdida 🐾</title>
    <style>
        /* Fondo azul marino INTENSO */
        body {
            background: linear-gradient(180deg, #001F3F 0%, #003366 100%);
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 30px 20px;
            position: relative;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Decoraciones de fondo con color más visible */
        body::before,
        body::after,
        .huella-1,
        .huella-2 {
            content: "🐾";
            position: absolute;
            font-size: 90px;
            color: rgba(255, 255, 255, 0.12);
            z-index: 0;
            pointer-events: none;
        }

        body::before {
            content: "🐶";
            top: 30px;
            left: 15px;
            font-size: 120px;
        }

        body::after {
            content: "🐱";
            top: 350px;
            right: 15px;
            font-size: 120px;
        }

        .huella-1 {
            bottom: 80px;
            left: 40px;
            font-size: 100px;
        }

        .huella-2 {
            top: 220px;
            right: 60px;
            font-size: 80px;
        }

        /* Contenedor con borde AZUL MARINO brillante */
        form {
            background: linear-gradient(180deg, #ffffff 0%, #e6f0ff 100%);
            padding: 35px;
            border-radius: 25px;
            max-width: 550px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
            border: 4px solid #001F3F;
            box-shadow: 
                0 0 25px rgba(0, 64, 128, 0.5),
                0 10px 30px rgba(0, 31, 63, 0.4);
        }

        /* Título con fondo y letras AZUL MARINO llamativo */
        h1 {
            text-align: center;
            color: #ffffff;
            background: linear-gradient(90deg, #001F3F, #004080);
            font-size: 26px;
            margin: -35px -35px 25px -35px;
            padding: 18px;
            border-radius: 21px 21px 0 0;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
            letter-spacing: 0.5px;
        }

        /* Secciones con fondo AZUL MARINO y letras blancas */
        h2 {
            color: #ffffff;
            background: linear-gradient(90deg, #001F3F, #004080);
            font-size: 17px;
            margin: 28px 0 12px 0;
            padding: 10px 15px;
            border-radius: 10px;
            box-shadow: 0 3px 8px rgba(0, 64, 128, 0.3);
        }

        /* Etiquetas en AZUL MARINO oscuro y negrita */
        label {
            display: block;
            color: #001F3F;
            font-weight: 900;
            font-size: 16px;
            margin-bottom: 7px;
            margin-top: 16px;
            text-shadow: 0 1px 1px rgba(0, 31, 63, 0.1);
        }

        /* Campos con borde AZUL MARINO llamativo */
        input, textarea {
            width: 100%;
            padding: 13px 15px;
            border: 3px solid #001F3F;
            border-radius: 12px;
            box-sizing: border-box;
            font-size: 15px;
            color: #001F3F;
            background-color: #cce0ff;
            transition: all 0.3s ease;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #0066cc;
            background-color: #99ccff;
            box-shadow: 0 0 15px rgba(0, 51, 102, 0.6);
        }

        textarea {
            resize: vertical;
            min-height: 90px;
        }

        /* Botón AZUL MARINO BRILLANTE y llamativo */
        button {
            width: 100%;
            margin-top: 30px;
            padding: 16px;
            background: linear-gradient(90deg, #001F3F, #004080, #0059b3);
            color: white;
            font-size: 20px;
            font-weight: 900;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            box-shadow: 
                0 5px 20px rgba(0, 31, 63, 0.5),
                inset 0 2px 0 rgba(255,255,255,0.2);
            transition: all 0.3s ease;
            letter-spacing: 1px;
        }

        button:hover {
            transform: scale(1.04);
            box-shadow: 
                0 8px 25px rgba(0, 51, 102, 0.7),
                inset 0 2px 0 rgba(255,255,255,0.3);
            background: linear-gradient(90deg, #003366, #004d99, #0066cc);
        }

        /* Texto de ayuda */
        .ayuda {
            color: #003366;
            font-size: 13px;
            margin-top: 5px;
            font-style: italic;
        }
    </style>
</head>
<body>

    <!-- Iconos decorativos de fondo -->
    <div class="huella-1"></div>
    <div class="huella-2"></div>

    <form>
        <h1>🐾 REPORTE DE MASCOTA PERDIDA 🐾</h1>

        <!-- SECCIÓN: DATOS DEL PROPIETARIO -->
        <h2>👤 TUS DATOS</h2>

        <label>Nombre completo del dueño o dueña</label>
        <input type="text" placeholder="Escribe tu nombre completo" required>

        <label>Teléfono o número de contacto</label>
        <input type="tel" placeholder="Tu número de contacto" required>

        <!-- SECCIÓN: DATOS DE LA MASCOTA -->
        <h2>🐾 DATOS DE TU MASCOTA</h2>

        <label>Nombre de tu mascota</label>
        <input type="text" placeholder="Ej: Lola, Rocky, Manchas..." required>

        <label>Tipo de animal y raza</label>
        <input type="text" placeholder="Ej: Perro - Pastor Alemán / Gato - Persa" required>

        <label>Descripción (color, tamaño, señas especiales)</label>
        <textarea placeholder="Ej: Color café con pecho blanco, tamaño mediano, lleva collar rojo, orejas caídas..."></textarea>

        <!-- SECCIÓN: UBICACIÓN -->
        <h2>📍 LUGAR Y FECHA</h2>

        <label>Lugar donde se perdió</label>
        <input type="text" placeholder="Ciudad, barrio, calle y referencia cercana" required>

        <label>Fecha en que se perdió</label>
        <input type="text" placeholder="Ej: 08 de septiembre de 2026">

        <!-- SECCIÓN: INFORMACIÓN ADICIONAL -->
        <h2>ℹ️ INFORMACIÓN ADICIONAL</h2>

        <label>Recompensa ofrecida (en Bolivianos)</label>
        <input type="number" min="0" step="1" placeholder="Escribe 0 si no ofreces recompensa">

        <label>Foto de tu mascota</label>
        <input type="file" accept="image/*">
        <div class="ayuda">📷 Sube una foto clara para que todos la reconozcan fácilmente</div>

        <button type="submit">✅ ENVIAR REPORTE</button>
    </form>

</body>
    </html>
